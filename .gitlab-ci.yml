Build and test:
  image: 'debian:bookworm'
  script: ci/gitlab-script.sh
  timeout: 3 hours

  cache:
    key: "ccache:os=debian-bookworm:systemclang=$CAIDE_USE_SYSTEM_CLANG:clang=$CAIDE_CLANG_VERSION"
    paths: [ 'ccache-cache' ]

  artifacts:
    paths:
      - cmd

  parallel:
    matrix:
      - CAIDE_USE_SYSTEM_CLANG: 'OFF'
      - CAIDE_USE_SYSTEM_CLANG: 'ON'
        CAIDE_CLANG_VERSION: [15, 16, 17, 18, 19, 20, 21, 22, 23]
